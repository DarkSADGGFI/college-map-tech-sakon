<!DOCTYPE html>
<html lang="en,th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Campus Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Custom Style Definitions -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
<div id="sidebar" style="position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); width: 300px; max-height: 90vh; overflow-y: auto; font-family: sans-serif;">
    
    <!-- 1. SEARCH VIEW (Default) -->
    <div id="search-view">
        <h3 style="margin-top: 0; margin-bottom: 10px;">Campus Navigation</h3>
        <input type="text" id="search-input" placeholder="Search building..." style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px;">
        <div id="search-results" style="max-height: 250px; overflow-y: auto;"></div>
    </div>

    <!-- 2. BUILDING DETAIL VIEW (Hidden by default) -->
    <div id="detail-view" style="display: none;">
        <!-- Back Button -->
        <button id="back-btn" style="background: none; border: none; color: #0056b3; cursor: pointer; padding: 0; margin-bottom: 10px; font-weight: bold;">
            &larr; Back to Search
        </button>
        
        <!-- Building Title -->
        <h2 id="building-title" style="margin: 0 0 10px 0; font-size: 1.3rem; color: #333;">Building Name</h2>

        <!-- Image Placeholder Slot -->
        <div id="building-image-container" style="width: 100%; height: 150px; background-color: #e0e0e0; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 13px; margin-bottom: 15px; background-size: cover; background-position: center;">
            <span>📷 [ Image Placeholder ]</span>
        </div>

        <!-- Rooms Container -->
        <div id="rooms-section">
            <h4 style="margin: 0 0 8px 0; color: #555;">Select a Room / Lab</h4>
            <div id="rooms-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
        </div>
    </div>

</div>

    <div class="app-container">
        <!-- Main Map UI Box -->
        <div id="map"></div>
    </div>

    <!-- Leaflet Engine JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Your Custom Campus Data File -->
    <script src="campus-data.js"></script>
    
    <!-- Core Application Logic -->
    <script src="app.js"></script>
</body>
</html>
